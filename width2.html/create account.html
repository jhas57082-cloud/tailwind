<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
    <div class="flex justify-center mt-10">
        <div class="  w-[450px] h-[650px] bg-gray-600 rounded-lg shadow-lg">
            <h1 class="text-white text-bold text-3xl text-center mt-8">Create Account</h1>
            <div class="mb-4 mt-5">
                <label class="ml-9 text-white">Full Name</label>
                <input type="text" placeholder="Enter you name" class="p-4 w-96 ml-8 rounded-lg">
                </div>
                <div class="mb-4 mt-5">
                   <label class="ml-9 text-white">Email</label>
                   <input type="text" placeholder="Enter you email" class="p-4 w-96 ml-8 rounded-lg">
                </div>
                <div class="mb-4 mt-5">
                    <label class="ml-9 text-white">Password</label>
                    <input type="password" placeholder="Enter your password" class="p-4 w-96 ml-8 rounded-lg">
                </div>
                <div class="mb-4 mt-5">
                    <label class="ml-9 text-white">Gender</label><br>
                    <div class="text-white ml-9 gap-7">
                    <input type="radio"> Male
                    <input type="radio"> Female
                    </div>
                </div>
                <div class="mb-4 mt-5">
                    <label class="ml-9 text-white">Course</label><br>
                
                    <select class="ml-9 bg-white rounded-lg w-96 p-4">
                        <option value="">BCA</option>
                        <option value="">mca</option>
                        <option value="">BBA</option>
                
                    </select>
                    
                       
                </div>
                <div  class="mb-4 mt-5">
                    <button class="w-96  p-4 bg-blue-500 text-white rounded-lg ml-9">Register</button>
                </div>
                
                
                
            

            

        
        

    </div>
    
</body>
</html>
